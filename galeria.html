
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Lesia 🐶</title>

    <style>
        body {
            background-color: orange;
            color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: navy;
            font-size: 120px;
        }

        .powrot {
            display: inline-block;
            background-color: navy;
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 120px;
            margin: 20px;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .galeria img {
            width: 162.5px;
            max-width: 25%;
            border: 5px solid navy;
            border-radius: 20px;
        }

        p {
            font-size: 30px;
        }
                .galeria img {
            cursor: zoom-in;
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .lightbox.visible {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border: 4px solid lightblue;
            border-radius: 12px;
        }

        .lightbox button {
            position: absolute;
            color: white;
            background: rgba(40, 40, 40, 0.8);
            border: 2px solid white;
            border-radius: 12px;
            padding: 8px 18px;
            margin: 0;
            cursor: pointer;
            z-index: 2;
        }

        .lightbox-close {
            top: 15px;
            right: 15px;
            font-size: 45px;
            line-height: 1;
        }

        .lightbox-prev,
        .lightbox-next {
            top: 50%;
            transform: translateY(-50%);
            font-size: 35px;
        }

        .lightbox-prev {
            left: 15px;
        }

        .lightbox-next {
            right: 15px;
        }

        @media (max-width: 600px) {
            .lightbox img {
                max-width: 95vw;
                max-height: 80vh;
            }

            .lightbox-close {
                top: 10px;
                right: 10px;
                font-size: 38px;
            }

            .lightbox-prev,
            .lightbox-next {
                font-size: 25px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>📸 GALERIA LESIA 🐶</h1>

    <p>
        Najlepsze zdjęcia naszego pieska!
    </p>

    <a class="powrot" href="index.html">⬅ Powrót na stronę główną</a>

    <div class="galeria">
      
<img src="20261021_160638.jpg" alt="Lesio 1">
<img src="20260911_142636.jpg" alt="Lesio 2">
<img src="20260924_150448.jpg" alt="Lesio 3">
<img src="20251025_175420.jpg" alt="Lesio 4">
<img src="20260111_121302.jpg" alt="Lesio 5">
<img src="Zrzut ekranu 2026-09-02 181544.png" alt="Lesio 6">
<img src="46a54c267ba5a7fb829b7e0065f542f7.png" alt="Lesio 7">
<img src="Zrzut ekranu 2026-09-02 181508.png" alt="Lesio 8">
<img src="20251224_211910.jpg" alt="Lesio 9">
<img src="20251025_175451.jpg" alt="Lesio 10">
<img src="20260206_213436.jpg" alt="Lesio 11">

    </div>
<div id="lightbox" class="lightbox" aria-hidden="true">

    <button type="button" class="lightbox-close" aria-label="Zamknij">×</button>

    <button type="button" class="lightbox-prev" aria-label="Poprzednie zdjęcie">❮</button>

    <img id="lightboxImage" src="" alt="Powiększone zdjęcie Lesia">

    <button type="button" class="lightbox-next" aria-label="Następne zdjęcie">❯</button>

</div>
    <script>
    const galleryImages = Array.from(
        document.querySelectorAll(".galeria img")
    );

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    let currentImageIndex = 0;

    function showLightboxImage(index) {
        currentImageIndex =
            (index + galleryImages.length) % galleryImages.length;

        lightboxImage.src = galleryImages[currentImageIndex].src;
        lightboxImage.alt = galleryImages[currentImageIndex].alt;
    }

    function openLightbox(index) {
        showLightboxImage(index);
        lightbox.classList.add("visible");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
        lightbox.classList.remove("visible");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
    }

    galleryImages.forEach((img, index) => {
        img.addEventListener("click", () => openLightbox(index));
    });

    document.querySelector(".lightbox-close")
        .addEventListener("click", closeLightbox);

    document.querySelector(".lightbox-prev")
        .addEventListener("click", () =>
            showLightboxImage(currentImageIndex - 1)
        );

    document.querySelector(".lightbox-next")
        .addEventListener("click", () =>
            showLightboxImage(currentImageIndex + 1)
        );

    lightbox.addEventListener("click", event => {
        if (event.target === lightbox) {
            closeLightbox();
        }
    });

    document.addEventListener("keydown", event => {
        if (!lightbox.classList.contains("visible")) return;

        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowRight") {
            showLightboxImage(currentImageIndex + 1);
        }
        if (event.key === "ArrowLeft") {
            showLightboxImage(currentImageIndex - 1);
        }
    });
</script>
</body>
</html>
