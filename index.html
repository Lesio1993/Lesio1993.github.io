        .reply-form {

            margin-top: 10px;
        }

        .reply-form.visible {

        .reply-status {

    <p id="visitCounter" style="font-size: 80px; color: navy; font-weight: bold;">

    <section class="guestbook">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://smjxdyiuboylxeriquoy.supabase.co";
        const SUPABASE_KEY = "sb_publishable_xA2Y1bsITi1FuBbgHtgxCw_foc5_YPk";

        const db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const likeButton = document.getElementById("like");
        const dislikeButton = document.getElementById("dislike");
        const statusText = document.getElementById("status");
        const voteNickname = document.getElementById("voteNickname");

        // LICZNIK ODWIEDZIN
        async function loadVisitCounter() {
            const counter = document.getElementById("visitCounter");

            const { data, error } = await db.rpc("register_site_visit");

            if (error) {
                counter.textContent =
                    "Nie udało się pobrać licznika odwiedzin.";
                console.error(error);
                return;
            }

            counter.textContent =
                "👀 Liczba odwiedzin strony: " + data;
        }

        // POBIERANIE GŁOSÓW
        async function loadVotes() {
            const { data, error } = await db
                .from("votes")
                .select("likes, dislikes")
                .eq("id", 1)
                .single();

            if (error) {
                statusText.textContent = "Nie udało się pobrać głosów.";
                console.error(error);
                return;
            }

            document.getElementById("likes").textContent = data.likes;
            document.getElementById("dislikes").textContent = data.dislikes;
        }

        // ODDAWANIE GŁOSU
        async function vote(choice) {
            const nickname = voteNickname.value.trim();

            if (nickname.length < 2 || nickname.length > 20) {
                statusText.textContent =
                    "Pseudonim musi mieć od 2 do 20 znaków.";
                return;
            }

            likeButton.disabled = true;
            dislikeButton.disabled = true;
            statusText.textContent = "Zapisywanie głosu...";

            const { error } = await db.rpc("cast_vote_with_nickname", {
                p_nickname: nickname,
                p_choice: choice
            });

            if (error) {
                console.error(error);

                if (error.code === "23505") {
                    statusText.textContent =
                        "Ten pseudonim oddał już głos w tej rundzie. Użyj innego.";
                } else {
                    statusText.textContent =
                        "Nie udało się oddać głosu. Spróbuj ponownie.";
                }

                likeButton.disabled = false;
                dislikeButton.disabled = false;
                return;
            }

            statusText.textContent = "Dziękujemy za głos, " + nickname + "!";
            await loadVotes();

            likeButton.disabled = false;
            dislikeButton.disabled = false;
        }

        likeButton.addEventListener("click", () => vote("like"));
        dislikeButton.addEventListener("click", () => vote("dislike"));

        // KSIĘGA GOŚCI
        async function loadGuestbook() {
            const entries = document.getElementById("guestbookEntries");

            const { data, error } = await db
                .from("guestbook")
                .select("id, nickname, message, created_at, thread_number")
                .eq("approved", true)
                .is("parent_id", null)
                .order("created_at", { ascending: false })
                .limit(50);

            if (error) {
                entries.textContent = "Nie udało się pobrać wiadomości.";
                console.error(error);
                return;
            }

            entries.replaceChildren();

            if (data.length === 0) {
                entries.textContent =
                    "Jeszcze nikt nie zostawił wiadomości. Bądź pierwszy!";
                return;
            }

            const parentIds = data.map(entry => entry.id);

            const { data: replies, error: replyError } = await db
                .from("guestbook")
                .select("id, parent_id, nickname, message, created_at, thread_number")
                .eq("approved", true)
                .in("parent_id", parentIds)
                .order("created_at", { ascending: true });

            if (replyError) {
                entries.textContent =
                    "Nie udało się pobrać odpowiedzi.";
                console.error(replyError);
                return;
            }

            data.forEach(entry => {
                const box = document.createElement("div");
                box.className = "guestbook-entry";

                const number = document.createElement("span");
                number.className = "thread-number";
                number.textContent = "#" + entry.thread_number;

                const name = document.createElement("strong");
                name.textContent = entry.nickname;

                const message = document.createElement("p");
                message.textContent = entry.message;

                const date = document.createElement("small");
                date.textContent =
                    new Date(entry.created_at).toLocaleString("pl-PL");

                box.append(number, name, message, date);

                const entryReplies = replies.filter(
                    reply => String(reply.parent_id) === String(entry.id)
                );

                entryReplies.forEach(reply => {
                    const replyBox = document.createElement("div");
                    replyBox.className = "reply-entry";

                    const replyNumber = document.createElement("span");
                    replyNumber.className = "thread-number";
                    replyNumber.textContent = "#" + reply.thread_number;

                    const replyName = document.createElement("strong");
                    replyName.textContent = reply.nickname;

                    const replyMessage = document.createElement("p");
                    replyMessage.textContent = reply.message;

                    const replyDate = document.createElement("small");
                    replyDate.textContent =
                        new Date(reply.created_at).toLocaleString("pl-PL");

                    replyBox.append(
                        replyNumber,
                        replyName,
                        replyMessage,
                        replyDate
                    );

                    box.appendChild(replyBox);
                });

                const replyButton = document.createElement("button");
                replyButton.type = "button";
                replyButton.className = "reply-button";
                replyButton.textContent = "Odpowiedz";

                const replyForm = document.createElement("form");
                replyForm.className = "reply-form";

                const nicknameInput = document.createElement("input");
                nicknameInput.type = "text";
                nicknameInput.placeholder = "Twój pseudonim";
                nicknameInput.minLength = 2;
                nicknameInput.maxLength = 20;
                nicknameInput.required = true;

                const messageInput = document.createElement("textarea");
                messageInput.placeholder = "Napisz odpowiedź...";
                messageInput.minLength = 3;
                messageInput.maxLength = 300;
                messageInput.required = true;

                const sendReply = document.createElement("button");
                sendReply.type = "submit";
                sendReply.textContent = "Wyślij odpowiedź 🐾";
                sendReply.className = "reply-button";

                const replyStatus = document.createElement("p");
                replyStatus.className = "reply-status";

                replyForm.append(
                    nicknameInput,
                    messageInput,
                    sendReply,
                    replyStatus
                );

                replyButton.addEventListener("click", () => {
                    replyForm.classList.toggle("visible");
                });

                replyForm.addEventListener("submit", async event => {
                    event.preventDefault();

                    const nickname = nicknameInput.value.trim();
                    const replyMessage = messageInput.value.trim();

                    if (
                        nickname.length < 2 ||
                        nickname.length > 20 ||
                        replyMessage.length < 3 ||
                        replyMessage.length > 300
                    ) {
                        replyStatus.textContent =
                            "Sprawdź długość pseudonimu i odpowiedzi.";
                        return;
                    }

                    sendReply.disabled = true;
                    replyStatus.textContent = "Wysyłanie odpowiedzi...";

                    const { error } = await db.rpc(
                        "submit_guestbook_reply",
                        {
                            p_parent_id: entry.id,
                            p_nickname: nickname,
                            p_message: replyMessage
                        }
                    );

                    sendReply.disabled = false;

                    if (error) {
                        console.error(error);
                        replyStatus.textContent =
                            "Nie udało się wysłać odpowiedzi. Spróbuj ponownie.";
                        return;
                    }

                    replyForm.reset();
                    replyStatus.textContent =
                        "Dziękujemy! Odpowiedź czeka na Twoją akceptację.";
                });

                box.append(replyButton, replyForm);
                entries.appendChild(box);
            });
        }

        // WYSYŁANIE NOWEJ WIADOMOŚCI
        const guestbookForm = document.getElementById("guestbookForm");

        guestbookForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const nickname =
                document.getElementById("guestbookNickname").value.trim();

            const message =
                document.getElementById("message").value.trim();

            const guestbookStatus =
                document.getElementById("guestbookStatus");

            const sendButton =
                document.getElementById("sendMessage");

            sendButton.disabled = true;
           guestbookStatus.textContent =
    "Dziękujemy za zostawienie opinii! Twój komentarz czeka na potwierdzenie (może to zająć do 8 godzin).";

            const { error } = await db.rpc("submit_guestbook_entry", {
                p_nickname: nickname,
                p_message: message
            });

            sendButton.disabled = false;

            if (error) {
                guestbookStatus.textContent =
                    "Nie udało się wysłać wiadomości. Spróbuj ponownie.";
                console.error(error);
                return;
            }

            guestbookForm.reset();

      guestbookStatus.textContent =
    "Dziękujemy za zostawienie opinii! Twój komentarz czeka na potwierdzenie (może to zająć do 8 godzin).";
        });

        // URUCHAMIANIE FUNKCJI
        loadVotes();
        loadGuestbook();
        loadVisitCounter();
    </script>
