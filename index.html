
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesio to piesio.</title>

    <style>
        body {
            background-color: orange;
            color: lightblue;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        button {
            font-size: 36px;
            padding: 22px 35px;
            margin: 15px;
            cursor: pointer;
            border-radius: 18px;
            border: none;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            font-size: 18px;
            color: navy;
        }

        #voteNickname {
            font-size: 24px;
            padding: 10px;
            border-radius: 10px;
        }

        .guestbook {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            color: navy;
        }

        .guestbook input,
        .guestbook textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid navy;
        }

        .guestbook textarea {
            min-height: 110px;
            resize: vertical;
        }

        .guestbook-entry {
            background: #fff1cc;
            color: navy;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .guestbook-entry small {
            color: #555;
        }

        #guestbookStatus {
            color: navy;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <br>

    <img src="DOWÓD na to ,że lesio to piesio.jpg"
         alt="Dowód na to, że Lesio to piesio"
         width="650">

    <h1 style="font-size: 120px; color: navy;">
        LESIO TO PIESIO!!!
    </h1>

    <h2 style="font-size: 35px; color: navy;">
        Czy podoba Ci się ta strona?
    </h2>

    <label for="voteNickname" style="font-size: 24px; color: navy;">
        Podaj swój pseudonim:
    </label>

    <br><br>

    <input
        type="text"
        id="voteNickname"
        placeholder="Twój pseudonim"
        maxlength="20"
        minlength="2"
        required
    >

    <br><br>

    <button id="like">👍 Lubię <span id="likes">0</span></button>
    <button id="dislike">👎 Nie lubię <span id="dislikes">0</span></button>

    <p id="status">Ładowanie głosów...</p>

    <section class="guestbook">
        <h2>📖 Księga gości Lesia</h2>

        <p>Zostaw wiadomość dla Lesia!</p>

        <form id="guestbookForm">
            <input
                type="text"
                id="guestbookNickname"
                placeholder="Twój pseudonim"
                minlength="2"
                maxlength="20"
                required
            >

            <textarea
                id="message"
                placeholder="Napisz coś miłego o Lesiu..."
                minlength="3"
                maxlength="300"
                required
            ></textarea>

            <button type="submit" id="sendMessage">
                Wyślij wiadomość 🐾
            </button>
        </form>

        <p id="guestbookStatus"></p>

        <h2>Wiadomości od odwiedzających</h2>

        <div id="guestbookEntries">
            Ładowanie wiadomości...
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://smjxdyiuboylxeriquoy.supabase.co";
        const SUPABASE_KEY = "sb_publishable_xA2Y1bsITi1FuBbgHtgxCw_foc5_YPk";

        const db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const likeButton = document.getElementById("like");
        const dislikeButton = document.getElementById("dislike");
        const statusText = document.getElementById("status");
        const voteNickname = document.getElementById("voteNickname");

        async function loadVotes() {
            const { data, error } = await db
                .from("votes")
                .select("likes, dislikes")
                .eq("id", 1)
                .single();

            if (error) {
                statusText.textContent = "Nie udało się pobrać głosów.";
                console.error(error);
                return;
            }

            document.getElementById("likes").textContent = data.likes;
            document.getElementById("dislikes").textContent = data.dislikes;
        }

        async function vote(choice) {
            const nickname = voteNickname.value.trim();

            if (nickname.length < 2 || nickname.length > 20) {
                statusText.textContent =
                    "Pseudonim musi mieć od 2 do 20 znaków.";
                return;
            }

            likeButton.disabled = true;
            dislikeButton.disabled = true;

            statusText.textContent = "Zapisywanie głosu...";

            const { error } = await db.rpc("cast_vote_with_nickname", {
                p_nickname: nickname,
                p_choice: choice
            });

            if (error) {
                console.error(error);

                if (
                    error.code === "23505" ||
                    error.message.includes("duplicate key")
                ) {
                    statusText.textContent =
                        "Ten pseudonim oddał już głos w tej rundzie. Użyj innego.";
                } else {
                    statusText.textContent =
                        "Nie udało się oddać głosu. Spróbuj ponownie.";
                }

                likeButton.disabled = false;
                dislikeButton.disabled = false;
                return;
            }

            statusText.textContent = "Dziękujemy za głos, " + nickname + "!";
            await loadVotes();

            likeButton.disabled = false;
            dislikeButton.disabled = false;
        }

        likeButton.addEventListener("click", () => vote("like"));
        dislikeButton.addEventListener("click", () => vote("dislike"));

        async function loadGuestbook() {
            const entries = document.getElementById("guestbookEntries");

            const { data, error } = await db
                .from("guestbook")
                .select("nickname, message, created_at")
                .eq("approved", true)
                .order("created_at", { ascending: false })
                .limit(50);

            if (error) {
                entries.textContent = "Nie udało się pobrać wiadomości.";
                console.error(error);
                return;
            }

            entries.replaceChildren();

            if (data.length === 0) {
                entries.textContent =
                    "Jeszcze nikt nie zostawił wiadomości. Bądź pierwszy!";
                return;
            }

            data.forEach(entry => {
                const box = document.createElement("div");
                box.className = "guestbook-entry";

                const name = document.createElement("strong");
                name.textContent = entry.nickname;

                const message = document.createElement("p");
                message.textContent = entry.message;

                const date = document.createElement("small");
                date.textContent =
                    new Date(entry.created_at).toLocaleString("pl-PL");

                box.append(name, message, date);
                entries.appendChild(box);
            });
        }

        const guestbookForm = document.getElementById("guestbookForm");

        guestbookForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const nickname =
                document.getElementById("guestbookNickname").value.trim();

            const message =
                document.getElementById("message").value.trim();

            const guestbookStatus =
                document.getElementById("guestbookStatus");

            const sendButton =
                document.getElementById("sendMessage");

            sendButton.disabled = true;
            guestbookStatus.textContent = "Wysyłanie wiadomości...";

            const { error } = await db.rpc("submit_guestbook_entry", {
                p_nickname: nickname,
                p_message: message
            });

            sendButton.disabled = false;

            if (error) {
                guestbookStatus.textContent =
                    "Nie udało się wysłać wiadomości. Spróbuj ponownie.";
                console.error(error);
                return;
            }

            guestbookForm.reset();

            guestbookStatus.textContent =
                "Dziękujemy! Wiadomość czeka na Twoją akceptację.";
        });

        loadVotes();
        loadGuestbook();
    </script>
</body>
</html>
